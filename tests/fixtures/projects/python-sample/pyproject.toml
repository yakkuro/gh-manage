[project]
name = "python-sample"
version = "0.0.0"
description = "Positive fixture project for gh-manage smoke testing."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_sample"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
