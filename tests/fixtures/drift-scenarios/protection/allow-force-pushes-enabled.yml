name: allow-force-pushes-enabled
description: "Current allow_force_pushes=true (weakened) but policy has false"
check: protection
repo: yakkuro/test-fixture
profile: python-service
inputs:
  current_protection:
    enforce_admins:
      enabled: false
    required_status_checks:
      strict: true
      contexts: ["PR Gate / PR Gate"]
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: false
      require_code_owner_reviews: false
    required_conversation_resolution:
      enabled: true
    required_linear_history:
      enabled: true
    allow_force_pushes:
      enabled: true
    allow_deletions:
      enabled: false
expected_findings:
  - severity: medium
    check: protection
    field_path_contains: allow_force_pushes
    message_contains: drift
