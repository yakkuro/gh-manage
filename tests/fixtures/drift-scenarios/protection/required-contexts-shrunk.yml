name: required-contexts-shrunk
description: "Current has extra contexts that aren't in profile.required_contexts"
check: protection
repo: yakkuro/test-fixture
profile: python-service
inputs:
  current_protection:
    enforce_admins:
      enabled: false
    required_status_checks:
      strict: true
      contexts:
        - "pr-gate / test"
        - legacy-check
    required_pull_request_reviews:
      required_approving_review_count: 0
      dismiss_stale_reviews: false
      require_code_owner_reviews: false
    required_conversation_resolution:
      enabled: true
    required_linear_history:
      enabled: true
    allow_force_pushes:
      enabled: false
    allow_deletions:
      enabled: false
expected_findings:
  - severity: critical
    check: protection
    field_path_contains: required_status_checks.contexts
    message_contains: weakened
