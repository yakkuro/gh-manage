name: Reusable PR Gate (Python)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to install (required)."
        required: true
        type: string
      working-directory:
        description: "Project directory inside the repo. Defaults to repo root."
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency install command executed inside working-directory."
        required: false
        type: string
        default: "uv sync"
      test-command:
        description: "Test command executed inside working-directory."
        required: false
        type: string
        default: "uv run pytest"
      lint:
        description: "Run ruff check + format --check (fixed tool, internal pin)."
        required: false
        type: boolean
        default: true
      type-check:
        description: "Run mypy on `src/` (fixed tool, internal pin)."
        required: false
        type: boolean
        default: true
      setup-command:
        description: "Optional shell command executed after install, before tests."
        required: false
        type: string
        default: ""
      uv-version:
        description: "uv release pin passed through to setup-python-uv."
        required: false
        type: string
        default: "0.5.0"
      gh-manage-ref:
        description: "Ref of yakkuro/gh-manage to check out for Layer-2 composite actions. MUST match the @<ref> you used in the uses: line. See docs/usage/python.md for the rationale."
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Layer-2 composite actions live in this repo (yakkuro/gh-manage) and
      # are referenced via `./.gh-manage/actions/<name>` after this checkout.
      # Cross-repo consumers MUST pin `gh-manage-ref` to the same `@<ref>`
      # they used in the `uses:` line — see input description above.
      - name: Checkout gh-manage (self, for Layer-2 composite actions)
        uses: actions/checkout@v4
        with:
          repository: yakkuro/gh-manage
          ref: ${{ inputs.gh-manage-ref }}
          path: .gh-manage
          fetch-depth: 1

      - name: Log gh-manage version
        uses: ./.gh-manage/actions/log-gh-manage-version

      - name: Set up Python and uv
        uses: ./.gh-manage/actions/setup-python-uv
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          echo "::group::install"
          echo "Running install-command: ${INSTALL_CMD}"
          eval "${INSTALL_CMD}"
          echo "::endgroup::"

      - name: Run ruff (if lint enabled)
        if: inputs.lint
        uses: ./.gh-manage/actions/run-ruff
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run mypy (if type-check enabled)
        if: inputs.type-check
        uses: ./.gh-manage/actions/run-mypy
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run setup command (if provided)
        if: inputs.setup-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_CMD: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          echo "::group::setup-command"
          echo "Running setup-command: ${SETUP_CMD}"
          if ! eval "${SETUP_CMD}"; then
            echo "::error::setup-command failed: ${SETUP_CMD}"
            exit 1
          fi
          echo "::endgroup::"

      - name: Run tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          echo "::group::test"
          echo "Running test-command: ${TEST_CMD}"
          eval "${TEST_CMD}"
          echo "::endgroup::"
