name: Doctor Smoke

on:
  pull_request:
    paths:
      - 'src/gh_manage/doctor/**'
      - 'src/gh_manage/findings.py'
      - 'src/gh_manage/data/templates/ci/**'
      - '.github/workflows/doctor-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/gh_manage/doctor/**'
      - 'src/gh_manage/findings.py'
      - 'src/gh_manage/data/templates/ci/**'
      - '.github/workflows/doctor-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-dogfood:
    name: doctor-smoke / gh-manage self (no criticals)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-extras

      # Self-dogfood uses a local `./...` reusable reference and its
      # own protection config, so shape/reusable-adoption (medium) and
      # shape/required-contexts-match (high) can both legitimately
      # fire against gh-manage itself without being smoke regressions.
      # The smoke check what we CARE about here is "no critical" —
      # that's the one doctor exists to catch. Informational findings
      # still surface in the JSON artifact so maintainers can track
      # them over time.
      # GH_TOKEN needs enough scope to read branch protection (the default
      # GITHUB_TOKEN has contents:read only and cannot query
      # /repos/{repo}/branches/{branch}/protection). Without the PAT the
      # doctor's live_required_contexts lookup returns () and
      # shape/job-shape-coherence fires a spurious CRITICAL because the
      # produced "PR Gate / PR Gate" is "not in" the empty required set.
      - name: Run doctor (exit 1 on critical only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_MANAGE_TOKEN }}
        run: |
          set -euo pipefail
          uv run gh-manage doctor . --profile python-service \
            --severity critical --report-mode stdout

      - name: Emit full report (informational)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_MANAGE_TOKEN }}
        run: |
          set -euo pipefail
          uv run gh-manage doctor . --profile python-service \
            --report-mode stdout --exit-zero
