name: Reusable PR Gate (TypeScript)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install (e.g., '20', '22'). Must be 20 or higher."
        required: true
        type: string
      working-directory:
        description: "Project directory inside the repo. Defaults to repo root."
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency install command executed inside working-directory. Runs via shell word splitting (${CMD}), NOT eval. Shell metacharacters (pipes, quotes, redirects, $(), ;) are not interpreted; pass space-separated arguments only. For commands needing shell features, use setup-command or a committed shell script."
        required: false
        type: string
        default: "pnpm install --frozen-lockfile"
      test-command:
        description: "Test command executed inside working-directory. Runs via shell word splitting (${CMD}), NOT eval. Shell metacharacters (pipes, quotes, redirects, $(), ;) are not interpreted; pass space-separated arguments only. For commands needing shell features, use setup-command or a committed shell script."
        required: false
        type: string
        default: "pnpm test"
      lint:
        description: "Run eslint via the consumer's devDependencies (requires eslint.config.js + eslint/typescript-eslint/@eslint/js in devDeps)."
        required: false
        type: boolean
        default: true
      type-check:
        description: "Run tsc --noEmit (TypeScript version pinned internally)."
        required: false
        type: boolean
        default: true
      setup-command:
        description: "Optional shell command executed after install, before tests. Runs via `eval` and interprets shell metacharacters (quotes, pipes, $()). SECURITY: only pass static literal values from trusted source. MUST NOT forward github.event.* fields, workflow_dispatch inputs, or any consumer-controlled string — doing so allows remote code execution in the PR gate. See docs/security.md."
        required: false
        type: string
        default: ""
      pnpm-version:
        description: "pnpm release pin passed through to setup-node-pnpm."
        required: false
        type: string
        default: "10.33.0"
      gh-manage-ref:
        description: "Ref of yakkuro/gh-manage to check out for Layer-2 composite actions. MUST match the @<ref> you used in the uses: line. See docs/usage/typescript.md for the rationale."
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Layer-2 composite actions live in this repo (yakkuro/gh-manage) and
      # are referenced via `./.gh-manage/actions/<name>` after this checkout.
      # Cross-repo consumers MUST pin `gh-manage-ref` to the same `@<ref>`
      # they used in the `uses:` line — see input description above.
      - name: Checkout gh-manage (self, for Layer-2 composite actions)
        uses: actions/checkout@v4
        with:
          repository: yakkuro/gh-manage
          ref: ${{ inputs.gh-manage-ref }}
          path: .gh-manage
          fetch-depth: 1

      - name: Log gh-manage version
        uses: ./.gh-manage/actions/log-gh-manage-version

      - name: Set up Node and pnpm
        uses: ./.gh-manage/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          echo "::group::install"
          echo "Running install-command: ${INSTALL_CMD}"
          ${INSTALL_CMD}
          echo "::endgroup::"

      - name: Run eslint (if lint enabled)
        if: inputs.lint
        uses: ./.gh-manage/actions/run-eslint
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run tsc (if type-check enabled)
        if: inputs.type-check
        uses: ./.gh-manage/actions/run-tsc
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run setup command (if provided)
        if: inputs.setup-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_CMD: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          echo "::group::setup-command"
          echo "Running setup-command: ${SETUP_CMD}"
          if ! eval "${SETUP_CMD}"; then
            echo "::error::setup-command failed: ${SETUP_CMD}"
            exit 1
          fi
          echo "::endgroup::"

      - name: Run tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          echo "::group::test"
          echo "Running test-command: ${TEST_CMD}"
          ${TEST_CMD}
          echo "::endgroup::"
