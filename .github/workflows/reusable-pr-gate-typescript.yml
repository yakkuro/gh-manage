name: Reusable PR Gate (TypeScript)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install (e.g., '20', '22'). Must be 20 or higher."
        required: true
        type: string
      working-directory:
        description: "Project directory inside the repo. Defaults to repo root."
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency install command executed inside working-directory."
        required: false
        type: string
        default: "pnpm install --frozen-lockfile"
      test-command:
        description: "Test command executed inside working-directory."
        required: false
        type: string
        default: "pnpm test"
      lint:
        description: "Run eslint via the consumer's devDependencies (requires eslint.config.js + eslint/typescript-eslint/@eslint/js in devDeps)."
        required: false
        type: boolean
        default: true
      type-check:
        description: "Run tsc --noEmit (TypeScript version pinned internally)."
        required: false
        type: boolean
        default: true
      setup-command:
        description: "Optional shell command executed after install, before tests."
        required: false
        type: string
        default: ""
      pnpm-version:
        description: "pnpm release pin passed through to setup-node-pnpm."
        required: false
        type: string
        default: "10.33.0"

permissions:
  contents: read

jobs:
  test:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions resolves `./<path>` references in a reusable workflow
      # against the runner's current workspace, which (after checkout of the
      # caller) contains the caller's repository, not gh-manage's. To make the
      # Layer-2 composite actions available in BOTH same-repo and cross-repo
      # invocations, the reusable workflow self-checks-out gh-manage into
      # `.gh-manage/` and references actions from there.
      - name: Extract gh-manage ref from github.workflow_ref
        id: self-ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # github.workflow_ref is "<owner>/<repo>/<path-to-workflow>@<ref>".
          # The workflow path always ends with `.yml`, so strip the shortest
          # prefix up to and including `.yml@` — this correctly handles refs
          # that themselves contain `@` (e.g., `release@candidate`). A naive
          # `${VAR##*@}` (longest prefix) would truncate such refs.
          if [[ "${WORKFLOW_REF}" != *.yml@* ]]; then
            echo "::error::Unexpected github.workflow_ref format (missing .yml@): ${WORKFLOW_REF}"
            exit 1
          fi
          ref="${WORKFLOW_REF#*.yml@}"
          if [[ -z "${ref}" ]]; then
            echo "::error::Empty ref parsed from github.workflow_ref='${WORKFLOW_REF}'"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "gh-manage ref resolved to: ${ref}"

      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gh-manage (self, for Layer-2 composite actions)
        uses: actions/checkout@v4
        with:
          repository: yakkuro/gh-manage
          ref: ${{ steps.self-ref.outputs.ref }}
          path: .gh-manage
          fetch-depth: 1

      - name: Log gh-manage version
        uses: ./.gh-manage/actions/log-gh-manage-version

      - name: Set up Node and pnpm
        uses: ./.gh-manage/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          echo "::group::install"
          echo "Running install-command: ${INSTALL_CMD}"
          eval "${INSTALL_CMD}"
          echo "::endgroup::"

      - name: Run eslint (if lint enabled)
        if: inputs.lint
        uses: ./.gh-manage/actions/run-eslint
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run tsc (if type-check enabled)
        if: inputs.type-check
        uses: ./.gh-manage/actions/run-tsc
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run setup command (if provided)
        if: inputs.setup-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_CMD: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          echo "::group::setup-command"
          echo "Running setup-command: ${SETUP_CMD}"
          if ! eval "${SETUP_CMD}"; then
            echo "::error::setup-command failed: ${SETUP_CMD}"
            exit 1
          fi
          echo "::endgroup::"

      - name: Run tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          echo "::group::test"
          echo "Running test-command: ${TEST_CMD}"
          eval "${TEST_CMD}"
          echo "::endgroup::"
