name: Run tsc
description: >
  Run the TypeScript compiler in --noEmit mode using a pinned
  TypeScript release. TypeScript is pinned here because tsc is
  a self-contained compiler with no peer dependencies — the
  direct analogue of Phase 1's pinned ruff via `uvx`.

inputs:
  working-directory:
    description: "Directory where tsc should operate. Defaults to the repo root."
    required: false
    default: "."
  typescript-version:
    description: "TypeScript version pin. Bumping this is a gh-manage concern."
    required: false
    default: "6.0.2"
  tsconfig:
    description: "Path (relative to working-directory) of the tsconfig to use."
    required: false
    default: "tsconfig.json"

runs:
  using: composite
  steps:
    - name: Run tsc --noEmit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPESCRIPT_VERSION: ${{ inputs.typescript-version }}
        TSCONFIG: ${{ inputs.tsconfig }}
      run: |
        set -euo pipefail
        echo "::group::tsc --noEmit"
        # pnpm 10+: `pnpm dlx typescript@<ver> tsc` fails with
        # ERR_PNPM_DLX_MULTIPLE_BINS because the typescript package
        # ships both `tsc` and `tsserver`. Use `--package=` to disambiguate.
        pnpm --package="typescript@${TYPESCRIPT_VERSION}" dlx tsc --noEmit -p "${TSCONFIG}"
        echo "::endgroup::"
