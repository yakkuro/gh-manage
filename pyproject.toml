[project]
name = "gh-manage"
version = "1.9.0"
description = "GitHub-based CI/CD, Issue management, and operational system for yakkuro/* repositories."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "yakkuro" },
]
keywords = ["github", "ci", "cd", "devops", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.5,<3",
    "python-json-logger>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
gh-manage = "gh_manage.cli:main"

[project.urls]
Homepage = "https://github.com/yakkuro/gh-manage"
Repository = "https://github.com/yakkuro/gh-manage"
Issues = "https://github.com/yakkuro/gh-manage/issues"

[dependency-groups]
dev = [
    "mypy>=1.12,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.12,<4",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_manage"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--ignore=tests/fixtures",
]

[tool.ruff]
extend-exclude = ["tests/fixtures/projects"]
